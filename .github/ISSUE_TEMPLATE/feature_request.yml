name: Feature request
description: Suggest an improvement to CopyFix
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like CopyFix to do?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: How does this improve detection, reduce false results, or make CopyFix easier to use?
    validations:
      required: true
